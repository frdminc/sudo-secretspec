name: CI

# Linux-capable part of .github/workflows/test.yml, run on SIPB Hyades
# (forgejo-ci skill). GitHub ignores this directory; the macOS and Windows
# legs of the tests matrix, and sudo-secretspec-cli itself (macOS-only: libc,
# dscl, /private/var), stay on GitHub's runners / the release flow.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Disjoint shim port range per repo: the runner host has one loopback port
  # space shared by all concurrent jobs and TSI sockets always carry
  # SO_REUSEPORT (libkrun#860), so overlapping ranges let one job's mock
  # servers silently steal another's ports (run 591: one vault test's connect
  # refused while this repo's job ran concurrently with secretspec-sqlite).
  # This repo: 20000-25999; secretspec-sqlite: 26000-31999.
  PORTSHIM_PORT_BASE: "20000"
  PORTSHIM_PORT_SPAN: "6000"

jobs:
  linux:
    name: linux (fmt, clippy, build, test, features, package)
    runs-on: ubuntu
    # A cold-cache full run (build + fmt/clippy + tests + the 14-provider
    # feature loop + package) measures ~41 min on the Hyades runner (run 585
    # was killed by this timeout mid-feature-loop with every test green; the
    # cargo registry cache only saves on a green run, so the first green run
    # is always the slowest). 60 leaves headroom for that.
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install gcc and Rust (pinned by rust-toolchain.toml)
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq gcc libc6-dev libsqlite3-dev pkg-config >/dev/null
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none >/dev/null
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache cargo registry
        uses: https://github.com/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Install SOPS 3.13.2
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64
          chmod 0755 /usr/local/bin/sops
      # libkrun TSI: listeners bound to port 0 are unreachable on this
      # runner, which the vault/openbao mock-server tests need; preload the
      # loopback-port-shim (forgejo-ci skill section 3) for every process.
      - name: Build and preload the loopback-port-shim
        run: |
          set -euo pipefail
          gcc -shared -fPIC -O2 -pthread -o /usr/local/lib/portshim.so .forgejo/loopback-port-shim.c -ldl
          echo /usr/local/lib/portshim.so >> /etc/ld.so.preload
      # Formatting and linting are platform-independent; run them once here.
      # sudo-secretspec-cli is excluded as in test.yml: it does not build on
      # Linux at all (macOS-only companion).
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --exclude secretspec-php-native --exclude sudo-secretspec-cli
      # The release gate (packaging/release.py) builds the secretspec crate;
      # keep that Linux-capable half verified here.
      - name: Build secretspec
        run: cargo build -p secretspec --locked
      - name: Run tests
        run: cargo test --workspace --exclude secretspec-php-native --exclude sudo-secretspec-cli
      # Each optional provider must compile on its own, not just in the
      # default feature set (same rationale as the GitHub job).
      - name: Check each provider feature standalone
        run: |
          set -euo pipefail
          for feature in cli keyring keeper gcsm awssm vault openbao infisical bws akv aac sops bw; do
            echo "== feature $feature"
            cargo check --package secretspec --no-default-features --features "$feature"
          done
      - name: Verify the published crate contains its schema fixture
        run: |
          set -euo pipefail
          fixture="secretspec/src/fixtures/resolution-report.schema.json"
          cmp schema/resolution-report.schema.json "$fixture"
          cargo package --package secretspec --list |
            grep -Fx 'src/fixtures/resolution-report.schema.json'

  # The NixOS half of the Linux port: `nix flake check` builds the package and
  # runs the VM test (nix/test.nix), which boots a minimal NixOS machine and
  # asserts the sudoers boundary (11 NOPASSWD grants, the exact broker
  # Defaults! line, no doctor/timestamp_timeout, and runtime sudo behaviour).
  # This is the only place that proof runs: the module's import-from-derivation
  # (`print-sudoers`) needs `allow-import-from-derivation = true`, and the VM
  # test needs QEMU, neither of which a macOS dev box has. There is no
  # committed flake.lock (single nixpkgs input), so the job generates it first.
  nix:
    name: nix (flake check: build + VM test)
    runs-on: ubuntu
    # NixOS test boots a QEMU VM; the Hyades runner has no KVM, so QEMU falls
    # back to TCG. The minimal boot + assertions are a few minutes, but the
    # first run also builds/downloads the NixOS closure, so leave headroom.
    timeout-minutes: 90
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: Install Nix
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh install \
            --no-confirm \
            --extra-conf "experimental-features = nix-command flakes" \
            --extra-conf "allow-import-from-derivation = true"
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          printf '%s\n' "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
      - name: nix flake check
        run: |
          set -euo pipefail
          . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          nix flake lock
          nix flake check
