name: Linux CI

# Overlay-only on ci/base. Port of .forgejo/workflows/ci.yml; no loopback-port-shim
# (GitHub runners are not libkrun). sudo-secretspec-cli stays macOS-only.

on:
  push:
    branches: ['ci/run/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux (fmt, clippy, build, test, features, package)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps and Rust
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-v1-
      - name: Install SOPS 3.13.2
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/sops https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64
          sudo chmod 0755 /usr/local/bin/sops
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --exclude secretspec-php-native --exclude sudo-secretspec-cli
      - name: Build secretspec
        run: cargo build -p secretspec --locked
      - name: Run tests
        run: cargo test --workspace --exclude secretspec-php-native --exclude sudo-secretspec-cli
      - name: Check each provider feature standalone
        run: |
          set -euo pipefail
          for feature in cli keyring keeper gcsm awssm vault openbao infisical bws akv aac sops bw; do
            echo "== feature $feature"
            cargo check --package secretspec --no-default-features --features "$feature"
          done
      - name: Verify the published crate contains its schema fixture
        run: |
          set -euo pipefail
          fixture="secretspec/src/fixtures/resolution-report.schema.json"
          cmp schema/resolution-report.schema.json "$fixture"
          cargo package --package secretspec --list |
            grep -Fx 'src/fixtures/resolution-report.schema.json'
