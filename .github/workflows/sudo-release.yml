name: sudo-secretspec downstream release checks

on:
  pull_request:
    paths:
      - "packaging/**"
      - "sudo-secretspec/**"
      - "sudo-secretspec-cli/**"
      - "skills/sudo-secretspec/**"
      - "tests/sudo_packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sudo-release.yml"
      - "CHANGELOG.md"
  push:
    tags:
      # Every downstream release tag, not one literal. This was pinned to
      # "v0.19.1-djbclark.1" and so fired exactly once, in the entire history
      # of the workflow -- .2, .3, sudo.4 and sudo.5 all published with the tag
      # leg silently skipped. The djbclark spelling stays because those tags
      # exist; it is the old version serial, not the org.
      - "v0.19.1-sudo.*"
      - "v0.19.1-djbclark.*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing release tag to build a bottle for, to prove the bottle job
          without publishing. Empty means the tag the checked-out formula names.
          A dispatch, even on a tag ref, only uploads a workflow artifact: the
          bottle is attached to a GitHub release only by the push of a release
          tag.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  packaging:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: |
          python -m pip install pytest ruff
          brew install sqlite
      # The companion is macOS-only, so this workflow is the only place its
      # Rust suite runs: the shared test.yml excludes it to keep the Linux and
      # Windows jobs building. Use Homebrew's SQLite rather than rusqlite's
      # `bundled` feature, which can hang in libsqlite3-sys build scripts.
      - name: Test downstream companion crate
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/sqlite/lib/pkgconfig
          LIBRARY_PATH: /opt/homebrew/opt/sqlite/lib
        run: cargo test -p sudo-secretspec-cli
      - name: Test release helper
        run: |
          python -m ruff check packaging tests/sudo_packaging
          python -m ruff format --check packaging tests/sudo_packaging
          python -m pytest tests/sudo_packaging -q
      - name: Check formula style and syntax
        run: |
          ruby -c packaging/homebrew/sudo-secretspec.rb
          brew style packaging/homebrew/sudo-secretspec.rb
      # A tag must name the version the workspace is actually stamped with.
      # This is the same invariant `packaging/release.py` enforces in preflight;
      # asserting it here catches a tag pushed by hand, which is exactly how
      # v0.19.1-sudo.4 shipped uninstallable.
      - name: Verify tag matches the stamped workspace version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          test -n "$version" || { echo "could not read workspace version"; exit 1; }
          echo "tag=$GITHUB_REF_NAME workspace=$version"
          test "$GITHUB_REF_NAME" = "v$version"

  # The macOS bottle `packaging/release.py` pours instead of compiling on the
  # maintainer's Mac (2026-10-18). Two jobs, split on purpose: `bottle` compiles
  # the whole crate graph (every build.rs and proc-macro in Cargo.lock runs
  # there), so it holds a read-only token and never sees GH_TOKEN; it only
  # uploads a workflow artifact. `publish-bottle` holds the write token but runs
  # no cargo or brew: it downloads that artifact and attaches it to the tag's
  # release, and only on the push of a release tag. release.py finds the tag's
  # run by head SHA, downloads the artifact and merges the `bottle do` block
  # into the tap formula.
  bottle:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    # xcode-27, not macos-latest: on 2026-10-20 the first live pour of the
    # v0.19.1-sudo.27 bottle failed because macos-latest is still macOS 26, so
    # the bottle was tagged arm64_tahoe while the target Mac runs macOS 27.0.1
    # (arm64_golden_gate) and Homebrew refused it with "`--force-bottle` passed
    # but ... has no bottle!". The xcode-27 image (GitHub-hosted, macOS 27,
    # arm64) went generally available 2026-10-15: GitHub changelog
    # "Xcode 27 runner image generally available" (2026-10-15) and
    # actions/runner-images#14404, which documents `runs-on: xcode-27`.
    # Label probed 2026-10-20 by a workflow_dispatch run of this workflow
    # before any release relied on it (adversary F1.3: an unmatched label
    # leaves the job queued for ~24h *after* the tag and Release are public,
    # because watch_run has no deadline).
    runs-on: xcode-27
    timeout-minutes: 90
    # id-token and attestations sign the build provenance below; neither one
    # grants write access to the repository, its releases or its tags.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # Two runs for one ref (a re-run, or a dispatch on a tag) queue rather than
    # race; a newer pending run still replaces an older pending one.
    concurrency:
      group: bottle-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAP: frdminc/sudo-secretspec
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A hosted label can be remapped in place -- `macos-latest` moved from
      # macOS 15 to 26 with no workflow change, which is precisely what made
      # v0.19.1-sudo.27 unpourable. Assert the image here, in CI, instead of
      # discovering it at the pour on the operator's Mac, which was the only
      # detector before 2026-10-20 (adversary F1.4, F1.5). Bump EXPECT_MACOS
      # deliberately when the Mac that pours these bottles moves.
      - name: Assert the runner is the GitHub-hosted macOS 27 arm64 image
        env:
          EXPECT_MACOS: "27"
          EXPECT_ARCH: arm64
        run: |
          set -euo pipefail
          # Defence in depth with release.py's `gh attestation verify
          # --deny-self-hosted-runners`: GitHub resolves an unrecognized
          # `runs-on` label against self-hosted pools rather than failing it.
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::runner is '${RUNNER_ENVIRONMENT:-unset}', not github-hosted"
            exit 1
          fi
          version="$(sw_vers -productVersion)"
          major="${version%%.*}"
          arch="$(uname -m)"
          echo "runner: macOS $version $arch, image ${ImageOS:-unknown} ${ImageVersion:-}"
          if [ "$major" != "$EXPECT_MACOS" ] || [ "$arch" != "$EXPECT_ARCH" ]; then
            echo "::error::expected macOS $EXPECT_MACOS on $EXPECT_ARCH, got $major on $arch: the runs-on label was remapped, so the bottle tag changes and stops pouring"
            exit 1
          fi
      # `brew install` refuses a formula that is not in a tap, so build from a
      # throwaway tap of the same name as the real one: the bottle JSON names the
      # formula `frdminc/sudo-secretspec/sudo-secretspec`, and `brew bottle
      # --merge` on the maintainer's Mac looks it up by that name.
      - name: Stage the release formula in a local tap
        id: formula
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(sed -n 's/^  version "\(.*\)"/\1/p' packaging/homebrew/sudo-secretspec.rb)"
          fi
          # Validate before the tag reaches $GITHUB_OUTPUT, a URL or a shell: a
          # tag name or dispatch input is an attacker-shaped string.
          [[ "$tag" =~ ^v0\.19\.1-sudo\.[1-9][0-9]*$ ]] || { echo "refusing tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$tag.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/src.tar.gz" "$url"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The archive is fetched by tag name, so check its own commit
            # record against the commit this run was triggered for: GitHub
            # embeds the id in every archive it generates. An accident check,
            # not an integrity one -- the record is inside the archive, so
            # whoever produces the bytes chooses it (same wording as
            # `archive_commit`'s docstring; adversary, 2026-10-20).
            # A temp file, not a pipe: with pipefail the
            # early exit of get-tar-commit-id would fail a pipe on SIGPIPE.
            gzip -dc "$RUNNER_TEMP/src.tar.gz" > "$RUNNER_TEMP/src.tar"
            commit="$(git get-tar-commit-id < "$RUNNER_TEMP/src.tar")"
            echo "archive of $tag is commit $commit; run commit $GITHUB_SHA"
            test "$commit" = "$GITHUB_SHA"
          fi
          sha="$(shasum -a 256 "$RUNNER_TEMP/src.tar.gz" | cut -d' ' -f1)"
          # release.py hashes the same archive itself and compares. The digest
          # also goes to $GITHUB_OUTPUT, which is recorded when this step ends
          # and so cannot be rewritten by the `build.rs` and proc-macro code
          # that runs under `brew install --build-bottle` in the next step; the
          # file on disk can be (adversary N6a, 2026-10-20).
          echo "$sha" > "$RUNNER_TEMP/source.sha256"
          echo "source_sha=$sha" >> "$GITHUB_OUTPUT"
          brew tap-new "$TAP"
          formula="$(brew --repository "$TAP")/Formula/sudo-secretspec.rb"
          cp packaging/homebrew/sudo-secretspec.rb "$formula"
          # The tag's own formula still names the previous release (release.py
          # restamps it after the tag exists), so restamp it with the same code.
          python3 -I - "$formula" "${tag#v}" "$sha" <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "packaging")
          import release

          path, version, sha = sys.argv[1:]
          release.rewrite_formula(Path(path), release.parse_release(version), sha)
          PY
          grep -n 'url "\|version "\|sha256 "' "$formula"
      - name: Build the bottle
        env:
          TAG: ${{ steps.formula.outputs.tag }}
          SOURCE_SHA: ${{ steps.formula.outputs.source_sha }}
        run: |
          set -euo pipefail
          brew install --build-bottle --verbose "$TAP/sudo-secretspec"
          brew test "$TAP/sudo-secretspec"
          mkdir "$RUNNER_TEMP/bottle"
          cd "$RUNNER_TEMP/bottle"
          brew bottle --json \
            --root-url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            "$TAP/sudo-secretspec"
          # brew writes `name--version.tag.bottle.tar.gz` locally and expects the
          # upload to use the single-dash name its JSON records.
          python3 -I - <<'PY'
          import json
          from pathlib import Path

          for path in Path(".").glob("*.json"):
              (entry,) = json.loads(path.read_text()).values()
              for spec in entry["bottle"]["tags"].values():
                  local = Path(spec["local_filename"])
                  assert local.is_file(), local
                  local.rename(spec["filename"])
                  print(f"{local} -> {spec['filename']}")
          PY
          # From the step output, not the on-disk file the build could have
          # overwritten (adversary N6a). The attest step below signs it.
          # Check the value, not the copy: re-reading the file one line after
          # writing it cannot fail, and cannot see a later overwrite either.
          # An empty output would otherwise write a bare newline and surface
          # much later as "the CI build compiled a different source archive".
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{64}$ ]] || {
            echo "source_sha is not a sha256: '$SOURCE_SHA'" >&2
            exit 1
          }
          printf '%s\n' "$SOURCE_SHA" > ./source.sha256
          ls -l
          echo "BOTTLE_DIR=$PWD" >> "$GITHUB_ENV"
      # A signed statement that this workflow, at this ref and commit, built
      # these bytes. release.py checks it with `gh attestation verify` for the
      # tarball and for the JSON (Homebrew writes the JSON's strings into the
      # tap formula's Ruby) before it writes anything into the tap.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.BOTTLE_DIR }}/*.bottle.tar.gz
            ${{ env.BOTTLE_DIR }}/*.bottle.json
            ${{ env.BOTTLE_DIR }}/source.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sudo-secretspec-bottle
          path: ${{ env.BOTTLE_DIR }}/*
          if-no-files-found: error

  # Write access lives only here, and only for the push of a release tag. This
  # job runs no cargo and no brew, so nothing from the crate graph shares a
  # process, a filesystem or an environment with the token. `needs: packaging`
  # keeps a bottle off a release whose tag/workspace check failed. An existing
  # asset of the same name is a hard failure (no --clobber): replacing the
  # bottle after release.py recorded its sha256 in the tap would break every
  # install of that release.
  publish-bottle:
    needs: [packaging, bottle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-bottle-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sudo-secretspec-bottle
          path: ${{ runner.temp }}/bottle
      # release.py creates the release right after pushing the tag, and the
      # bottle job takes far longer than that, but wait rather than assume.
      - name: Attach the bottle to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bottle"
          ls -l
          for _ in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ./*.bottle.tar.gz ./*.bottle.json
