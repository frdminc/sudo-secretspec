name: "Node addon"

# Builds the napi-rs Node addon (secretspec.node) per platform and smoke tests
# it. On a version tag, publishes it to npm as per-platform optional packages
# (secretspec-<platform>, referenced via the main `secretspec` package's
# optionalDependencies) using @napi-rs/cli, authenticated via npm Trusted
# Publishing (OIDC) -- no NPM_TOKEN stored in CI.
#
# The glibc Linux builds run in manylinux_2_28 images (AlmaLinux 8, glibc
# 2.28) via `docker run`, so the published addon loads on any distro with
# glibc >= 2.28 (RHEL 8/9, Amazon Linux 2023, Debian 10+, Ubuntu 18.10+).
# Building on the bare runner instead links the runner's glibc (2.39 on
# ubuntu-24.04), which broke RHEL 9-family distros (issue #136). A GitHub
# Actions job container still mounts the runner tool cache and can leave
# rustup's $HOME pointing at /github/home while the process is root, so
# the linker may record GLIBC_2.29 from the host libm; docker run keeps
# the toolchain and the 2.28 sysroot together. A post-build step fails the
# job if the addon's glibc floor or NEEDED libraries regress.
#
# The musl builds live in a separate `musl` job, because an Alpine job container
# cannot run JavaScript actions on an ARM runner. npm keeps the two libc variants
# apart through the `libc` field in each platform package (issue #383).

on:
  workflow_call:
    inputs:
      pre_release:
        description: Run as part of the canonical pre-release suite
        required: false
        type: boolean
        default: false
      publish:
        description: Publish the built packages to npm
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built packages to npm
        required: false
        type: boolean
        default: false
  push:
    tags:
      - v**
      # Not this fork's -sudo.N tags (see sudo-release.yml).
      - '!v*-sudo.*'
  # PR runs are scoped to changes in the Node SDK or this workflow. Core
  # resolver changes are verified on PRs by the devenv-based test.yml and
  # sdks.yml; the full matrix here still runs on tags and manual dispatch.
  pull_request:
    paths:
      - "secretspec-node/**"
      - ".github/workflows/node-addon.yml"
      - "scripts/install-rustup.sh"
      - "scripts/sync-sdk-versions.sh"

permissions:
  contents: read

jobs:
  addon:
    name: ${{ matrix.target }}
    if: >-
      inputs.pre_release ||
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `platform` is napi-rs's platformArchABI naming (see
          # secretspec-node/npm/<platform>/), used to name the artifact that
          # feeds the publish job below.
          - target: linux-x64
            platform: linux-x64-gnu
            runner: ubuntu-latest
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.08.05-1@sha256:e0b40ace8e818e96026eb47714b01998cbca022a6995797d0905474ce3e82ae8
          - target: linux-arm64
            platform: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.08.05-1@sha256:f766b402889e40f439e7a3ee5788eef1aa3ef399d0110107d27419fa2ba9d905
          - { target: darwin-arm64, platform: darwin-arm64, runner: macos-latest }
          - { target: win32-x64, platform: win32-x64-msvc, runner: windows-latest }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync SDK package versions
        run: bash scripts/sync-sdk-versions.sh

      - name: Install SQLite (the CLI links the system sqlite)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Link SQLite statically so the published artifact does not need a
          # sqlite3.dll next to it. The static-md triplet keeps the dynamic C
          # runtime that Rust's MSVC target uses.
          vcpkg install sqlite3:x64-windows-static-md
          $prefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows-static-md"
          echo "SQLITE3_LIB_DIR=$prefix\lib" >> $env:GITHUB_ENV
          echo "SQLITE3_INCLUDE_DIR=$prefix\include" >> $env:GITHUB_ENV
          echo "SQLITE3_STATIC=1" >> $env:GITHUB_ENV

      - name: Install Rust (pinned by rust-toolchain.toml)
        if: ${{ !matrix.image }}
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.image }}
        with:
          node-version: "22"
      - name: Install napi CLI
        if: ${{ !matrix.image }}
        run: npm ci
        working-directory: secretspec-node

      - name: Build the addon and run the SDK tests
        if: ${{ !matrix.image }}
        shell: bash
        run: |
          bash secretspec-node/scripts/build-addon.sh
          ( cd secretspec-node && node --test )

      - name: Build the addon and run the SDK tests (manylinux)
        if: ${{ matrix.image }}
        shell: bash
        run: |
          # Job containers still expose the runner tool cache and set
          # HOME=/github/home while the process is root, which has produced
          # addons that require GLIBC_2.29 even though this image is 2.28.
          # docker run keeps rustc and the 2.28 sysroot isolated, the same
          # shape the musl jobs already use.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env HOME=/root \
            "${{ matrix.image }}" \
            bash -c '
              set -euo pipefail
              bash scripts/install-rustup.sh
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup toolchain install
              # The addon links system sqlite (rusqlite is not bundled).
              # Prefer a static archive so the .node does not need libsqlite3
              # at load time; fall back to the shared library if no .a is
              # in the image.
              yum install -y sqlite-devel
              yum install -y sqlite-static || true
              # SQLITE3_STATIC alone is not enough: libsqlite3-sys asks
              # pkg-config first, even with SQLITE3_LIB_DIR set, and
              # pkg-config links system-directory libraries dynamically.
              # SQLITE3_NO_PKG_CONFIG skips that probe so the archive in
              # SQLITE3_LIB_DIR is linked statically.
              for d in /usr/lib64 /usr/lib; do
                if [ -f "$d/libsqlite3.a" ]; then
                  export SQLITE3_STATIC=1 SQLITE3_NO_PKG_CONFIG=1 \
                    SQLITE3_LIB_DIR="$d" SQLITE3_INCLUDE_DIR=/usr/include
                  break
                fi
              done
              case "$(uname -m)" in
                x86_64) nodearch=x64 ;;
                aarch64) nodearch=arm64 ;;
                *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
              esac
              # Pin matches the Node 22 line setup-node currently installs.
              node_ver=22.23.5
              curl -fsSL "https://nodejs.org/dist/v${node_ver}/node-v${node_ver}-linux-${nodearch}.tar.xz" \
                | tar -xJ -C /usr/local --strip-components=1
              # Omit optionalDependencies: package.json still pins published
              # 0.12.2 platform packages, which can mask a local load error
              # with their own glibc floor.
              ( cd secretspec-node && npm ci --omit=optional )
              bash secretspec-node/scripts/build-addon.sh
              bash scripts/check-linux-portability.sh secretspec-node/secretspec.node
              ( cd secretspec-node && node --test )
            '

      - name: Verify addon portability (glibc <= 2.28, no libdbus)
        if: ${{ matrix.image }}
        shell: bash
        run: bash scripts/check-linux-portability.sh secretspec-node/secretspec.node

      - name: Copy the addon to its platform-specific filename for publishing
        shell: bash
        run: cp secretspec-node/secretspec.node "secretspec-node/secretspec.${{ matrix.platform }}.node"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-addon-${{ matrix.target }}
          path: secretspec-node/secretspec.${{ matrix.platform }}.node

  musl:
    name: ${{ matrix.target }}
    if: >-
      inputs.pre_release ||
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.title, 'Release ')
    # GitHub Actions runs JavaScript actions inside an Alpine container only on
    # x64 runners, so an Alpine job container breaks checkout on the ARM runner.
    # These legs stay on the host and drive the build through docker run, the
    # same shape dotnet-package.yml uses for its musl assets. Each image is
    # Alpine based and matches its runner architecture, so the addon builds and
    # tests natively against musl with no cross toolchain (issue #383).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-musl
            runner: ubuntu-latest
            image: quay.io/pypa/musllinux_1_2_x86_64:2026.08.05-1@sha256:c7b2187aa4d095a8da73ea4db96acefd46701a13439a9cc4546f5d61a4b5bba1
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/musllinux_1_2_aarch64:2026.08.05-1@sha256:668c455aeddf5e363bd6fd801f10b369a634a9f01974876cee8c8c518b44ef10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync SDK package versions
        run: bash scripts/sync-sdk-versions.sh

      - name: Build the addon and run the SDK tests
        shell: bash
        run: |
          # For a musl target napi-rs points cargo at a cross toolchain named
          # <arch>-linux-musl-gcc. This container builds musl natively, where
          # the compiler is plain gcc, so the variables below name it instead;
          # napi-rs keeps a linker the environment already sets. napi-rs adds
          # -C target-feature=-crt-static for musl targets on its own.
          #
          # Variables in this single-quoted script expand inside the container,
          # not in the outer workflow shell.
          # shellcheck disable=SC2016
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc \
            --env CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc \
            --env SQLITE3_STATIC=1 \
            --env SQLITE3_LIB_DIR=/usr/lib \
            --env SQLITE3_NO_PKG_CONFIG=1 \
            --env SQLITE3_INCLUDE_DIR=/usr/include \
            "${{ matrix.image }}" \
            bash -c '
              set -euo pipefail
              # setup-node serves glibc builds, so Node comes from Alpine.
              # The addon links the system sqlite (rusqlite is not bundled).
              # SQLITE3_STATIC plus sqlite-static embeds libsqlite3.a so the
              # later node:alpine smoke test can load the addon without a
              # distro libsqlite3 package. SQLITE3_LIB_DIR plus
              # SQLITE3_NO_PKG_CONFIG are needed because pkg-config links
              # libraries in /usr/lib dynamically even when SQLITE3_STATIC
              # is set. One SDK test also builds the
              # secretspec CLI, which links statically on musl and needs
              # the static zlib archive.
              apk add --no-cache nodejs npm sqlite-dev sqlite-static zlib-dev zlib-static
              bash scripts/install-rustup.sh
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup toolchain install
              ( cd secretspec-node && npm ci --omit=optional )
              bash secretspec-node/scripts/build-addon.sh
              ( cd secretspec-node && node --test )
            '

      - name: Verify addon portability (musl libc, no libdbus)
        shell: bash
        run: |
          bash scripts/check-musl-portability.sh secretspec-node/secretspec.node
          # SQLite must be linked in, not loaded from the distro at runtime.
          if readelf -d secretspec-node/secretspec.node | grep -q 'libsqlite3'; then
            echo "secretspec.node still needs a shared libsqlite3" >&2
            exit 1
          fi

      - name: Load the addon on node:alpine
        shell: bash
        run: |
          # musllinux_1_2 and node:alpine are different Alpine releases, so
          # confirm the addon loads on the image a Node service runs.
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace/secretspec-node \
            node:24-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43 \
            node --test

      - name: Copy the addon to its platform-specific filename for publishing
        shell: bash
        run: cp secretspec-node/secretspec.node "secretspec-node/secretspec.${{ matrix.target }}.node"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-addon-${{ matrix.target }}
          path: secretspec-node/secretspec.${{ matrix.target }}.node


  publish:
    name: publish to npm
    # Version tags publish automatically. A standalone manual run can opt in to
    # re-publishing one SDK, while reusable pre-release runs always leave this off.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.publish
    needs: [addon, musl]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing (OIDC), no token needed
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sync SDK package versions
        run: bash scripts/sync-sdk-versions.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (Trusted Publishing needs npm >= 11.5.1)
        # Pin to 11.x: npm 12's in-place global self-install leaves libnpmpublish's
        # bundled sigstore dependency missing, which breaks provenance publishing
        # ("Cannot find module 'sigstore'"). 11.5.1+ satisfies Trusted Publishing.
        run: npm install -g npm@^11.5.1
      - name: Install napi CLI
        run: npm ci
        working-directory: secretspec-node
      - name: Scaffold per-platform npm package dirs
        run: node_modules/.bin/napi create-npm-dirs
        working-directory: secretspec-node
      - name: Download platform addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-addon-*
          path: artifacts
          merge-multiple: true
      - name: Place each addon into its npm package dir
        shell: bash
        run: |
          for f in artifacts/secretspec.*.node; do
            platform="$(basename "$f" .node | sed 's/^secretspec\.//')"
            cp "$f" "secretspec-node/npm/$platform/$(basename "$f")"
          done
      - name: Publish platform packages
        # --tag-style npm: our tags are `vX.Y.Z`, not lerna's `pkg@X.Y.Z`.
        # --no-gh-release: v-release.yml (cargo-dist) already creates the
        # GitHub Release for this tag; a second one here would conflict.
        working-directory: secretspec-node
        run: node_modules/.bin/napi pre-publish --tag-style npm --no-gh-release
      - name: Publish main package
        working-directory: secretspec-node
        run: npm publish
