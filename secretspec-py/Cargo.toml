[package]
name = "secretspec-py-native"
# maturin requires a PEP 440 version. The workspace uses SemVer pre-release
# identifiers such as 0.21.1-sudo.7, which PEP 440 rejects. Keep this in
# lockstep with pyproject.toml (scripts/sync-sdk-versions.sh writes both).
version = "0.21.1+sudo.7"
edition.workspace = true
repository = "https://github.com/cachix/secretspec"
description = "pyo3 extension for the Python SDK"
license = "Apache-2.0"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
secretspec = { workspace = true }
