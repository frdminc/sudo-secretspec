[package]
name = "sudo-secretspec-cli"
version.workspace = true
edition.workspace = true
description = "sudo-secretspec drift-check and runtime validation"

[lib]
name = "sudo_secretspec_cli"
path = "src/lib.rs"

[[bin]]
name = "sudo-secretspec"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dotenv.workspace = true
rusqlite = { version = "0.31" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# `sqlite` is not optional for the broker: `broker::execute` builds its provider
# URI as `sqlite://<vault>/secrets.db?history=true`, so a build without the
# feature registers no backend for it and every operation fails with "Provider
# backend 'sqlite' not found" — after the vault has already been migrated onto
# it. The rest stay off deliberately: a root-adjacent process has no business
# linking cloud SDKs, `clap`, or `inquire`.
secretspec = { path = "../secretspec", version = "0.19.1-sudo.24", default-features = false, features = ["manifest-edit", "codegen-schema", "sqlite"] }
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"